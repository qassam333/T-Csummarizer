<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* ---------- header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #e8e8e8;
    }
    .header-icon {
      width: 28px; height: 28px;
      background: #185FA5;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { display: block; }
    .header-title { font-size: 14px; font-weight: 600; color: #111; }

    /* ---------- body ---------- */
    .body { padding: 16px; }

    /* ---------- analyze button (idle state) ---------- */
    #analyzeButton {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      background: #fff;
      color: #111;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #analyzeButton:hover { background: #f5f5f5; }
    #analyzeButton:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- loading ---------- */
    #loading {
      display: none;
      text-align: center;
      padding: 24px 0;
      font-size: 13px;
      color: #666;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #e0e0e0;
      border-top-color: #185FA5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- error ---------- */
    #error {
      display: none;
      background: #FCEBEB;
      border: 1px solid #F7C1C1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #A32D2D;
      margin-bottom: 12px;
    }

    /* ---------- result card ---------- */
    #result { display: none; }

    .rating-row {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .ring-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
    .ring-wrap svg { display: block; }
    .ring-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: #111;
    }
    .rating-label { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .rating-desc { font-size: 12px; color: #555; line-height: 1.5; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 7px;
    }
    .summary-text {
      font-size: 13px;
      color: #222;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .flags { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .flag {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 9px 10px;
      border-radius: 8px;
    }
    .flag-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .flag-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .flag-detail { font-size: 12px; line-height: 1.5; }

    .flag.high  { background: #FCEBEB; border: 1px solid #F7C1C1; }
    .flag.high  .flag-dot   { background: #A32D2D; }
    .flag.high  .flag-title { color: #791F1F; }
    .flag.high  .flag-detail{ color: #A32D2D; }

    .flag.medium { background: #FAEEDA; border: 1px solid #FAC775; }
    .flag.medium .flag-dot   { background: #854F0B; }
    .flag.medium .flag-title { color: #633806; }
    .flag.medium .flag-detail{ color: #854F0B; }

    .flag.low   { background: #EAF3DE; border: 1px solid #C0DD97; }
    .flag.low   .flag-dot   { background: #3B6D11; }
    .flag.low   .flag-title { color: #27500A; }
    .flag.low   .flag-detail{ color: #3B6D11; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2a6 6 0 100 12A6 6 0 008 2zm0 1.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9zm0 2a.75.75 0 100 1.5.75.75 0 000-1.5zm-.75 2.5h1.5v3.5h-1.5V8z" fill="white"/>
      </svg>
    </div>
    <span class="header-title">T&amp;C Summarizer</span>
  </div>

  <div class="body">
    <div id="error"></div>

    <div id="loading">
      <div class="spinner"></div>
      Analyzing policy…
    </div>

    <div id="result"></div>

    <button id="analyzeButton">Analyze this page</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
